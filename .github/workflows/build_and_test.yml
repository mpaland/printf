name: Build and test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: ${{ matrix.cc }} ${{ matrix.config }} / disable ${{ matrix.disable }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        config: [Debug]
        disable: [none, FLOAT, EXPONENTIAL, LONG_LONG, PTRDIFF_T]
        include:
          - { cc: gcc,   config: Release, disable: none }
          - { cc: clang, config: Release, disable: none }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cc == 'gcc' && 'g++' || 'clang++' }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DPRINTF_BUILD_AUTOTEST=ON
          ${{ matrix.disable != 'none' && format('-DPRINTF_DISABLE_SUPPORT_{0}=ON', matrix.disable) || '' }}

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  msvc:
    name: msvc ${{ matrix.config }} / disable ${{ matrix.disable }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        config: [Debug]
        disable: [none, FLOAT, EXPONENTIAL, LONG_LONG, PTRDIFF_T]
        include:
          - { config: Release, disable: none }
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DPRINTF_BUILD_AUTOTEST=ON
          ${{ matrix.disable != 'none' && format('-DPRINTF_DISABLE_SUPPORT_{0}=ON', matrix.disable) || '' }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }}

      - name: Test
        run: ctest --test-dir build --build-config ${{ matrix.config }} --output-on-failure

  sanitizers:
    name: clang ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: |
          san="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            "-DCMAKE_C_FLAGS=$san" "-DCMAKE_CXX_FLAGS=$san" "-DCMAKE_EXE_LINKER_FLAGS=$san"

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure
